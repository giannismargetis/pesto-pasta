<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PESTO + PASTA — 60s Showcase</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;color:#fff}
  #stage{position:fixed;inset:0;display:grid;place-items:center}
  canvas{width:min(100vw,177.7778vh);height:min(56.25vw,100vh);display:block;background:#06080a}
  #gate{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,#10190f,#050607 70%);cursor:pointer;z-index:5;transition:opacity .5s}
  #gate.off{opacity:0;pointer-events:none}
  #gate h1{margin:0;font:900 clamp(40px,8vw,120px)/1 "Segoe UI Black","Arial Black",sans-serif;letter-spacing:-.02em;
    background:linear-gradient(90deg,#8fe04a,#ffb02e);-webkit-background-clip:text;background-clip:text;color:transparent}
  #gate p{margin:18px 0 0;font-size:clamp(14px,1.6vw,22px);letter-spacing:.35em;color:#9aa;text-align:center}
  #gate .go{margin-top:36px;display:inline-block;padding:16px 44px;border:2px solid #8fe04a;border-radius:999px;color:#8fe04a;font-weight:700;letter-spacing:.3em;animation:pl 1.2s infinite}
  @keyframes pl{50%{box-shadow:0 0 40px #8fe04a66;transform:scale(1.04)}}
  #hint{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);font:12px Consolas,monospace;color:#789;opacity:0;transition:opacity .6s;z-index:4;white-space:nowrap}
  #hint.on{opacity:.8}
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="gate"><div style="text-align:center"><h1>PESTO + PASTA</h1><p>60-SECOND SHOWCASE · SOUND ON</p><span class="go">CLICK TO PLAY</span></div></div>
<div id="hint">SPACE pause · ←/→ seek · R restart · M mute · F fullscreen · E export WebM</div>

<script>
"use strict";
/* ============================================================
   PESTO + PASTA — 60 s kinetic showcase
   Fully deterministic: render(t) draws any frame of the timeline.
   ============================================================ */
const W = 1920, H = 1080, DUR = 60;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const SANS = '"Segoe UI Black","Arial Black","Segoe UI",sans-serif';
const UI = '"Segoe UI","Helvetica Neue",Arial,sans-serif';
const MONO = 'Consolas,"Cascadia Mono",monospace';
const GREEN = '#8fe04a', ORANGE = '#ffb02e', CYAN = '#3de5ff', RED = '#ff4d5e', AMBER = '#ffc83d', INK = '#06080a';
const BPM = 128, BEAT = 60 / BPM;

/* ---------- math helpers ---------- */
const c01 = x => Math.max(0, Math.min(1, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => c01((t - a) / (b - a));
const outCubic = x => 1 - Math.pow(1 - x, 3);
const outExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const outBack = x => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const inOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const smooth = x => x * x * (3 - 2 * x);
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(20261004);

/* ---------- drawing helpers ---------- */
function T(s, x, y, o = {}) {
  const { size = 60, color = '#fff', align = 'center', weight = 800, font = SANS, alpha = 1, ls = 0, glitch = 0, shadow = null, base = 'middle', stroke = null } = o;
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.font = `${weight} ${size}px ${font}`;
  ctx.textAlign = align; ctx.textBaseline = base;
  if ('letterSpacing' in ctx) ctx.letterSpacing = ls + 'px';
  if (shadow) { ctx.shadowColor = shadow; ctx.shadowBlur = size * .45; }
  if (glitch > 0) {
    const g = glitch * size * .07;
    ctx.fillStyle = RED; ctx.fillText(s, x - g, y);
    ctx.fillStyle = CYAN; ctx.fillText(s, x + g, y);
  }
  if (stroke) { ctx.lineWidth = stroke.w; ctx.strokeStyle = stroke.c; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
  ctx.restore();
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function card(x, y, w, h, o = {}) {
  const { fill = 'rgba(14,20,24,.88)', stroke = 'rgba(255,255,255,.14)', glow = null, r = 28, lw = 2 } = o;
  ctx.save();
  if (glow) { ctx.shadowColor = glow; ctx.shadowBlur = 40; }
  rr(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill();
  ctx.shadowBlur = 0; ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke();
  ctx.restore();
}
function withTransform(cx, cy, sc, rot, fn) { ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot); ctx.scale(sc, sc); fn(); ctx.restore(); }
function key(label, cx, cy, w, h, pressed, col) {
  const dy = pressed ? 10 : 0;
  ctx.save();
  rr(cx - w / 2, cy - h / 2 + 14, w, h, 24); ctx.fillStyle = '#000'; ctx.fill();
  if (pressed) { ctx.shadowColor = col; ctx.shadowBlur = 70; }
  rr(cx - w / 2, cy - h / 2 + dy, w, h - (pressed ? 0 : 10), 24);
  ctx.fillStyle = pressed ? col : '#1b242b'; ctx.fill();
  ctx.shadowBlur = 0; ctx.lineWidth = 3; ctx.strokeStyle = pressed ? '#fff' : '#3a4852'; ctx.stroke();
  ctx.restore();
  T(label, cx, cy + dy - 4, { size: h * .26, color: pressed ? '#0a1208' : '#cfe', font: UI, weight: 800, ls: 2 });
}
function pill(txt, x, y, col, o = {}) {
  const { size = 30, padX = 26, h = 56, fillA = .16, align = 'center' } = o;
  ctx.save(); ctx.font = `800 ${size}px ${UI}`;
  const w = ctx.measureText(txt).width + padX * 2 + (('letterSpacing' in ctx) ? 0 : 0);
  ctx.restore();
  const x0 = align === 'center' ? x - w / 2 : x;
  ctx.save();
  rr(x0, y - h / 2, w, h, h / 2); ctx.fillStyle = col + '28'; ctx.fill();
  ctx.lineWidth = 2.5; ctx.strokeStyle = col; ctx.stroke(); ctx.restore();
  T(txt, x0 + w / 2, y + 1, { size, color: col, font: UI, weight: 800 });
  return w;
}
function typed(str, p) { return str.slice(0, Math.floor(str.length * c01(p))); }
function pulse(t, rate = 1) { const ph = (t / (BEAT * rate)) % 1; return Math.exp(-ph * 5); }
function hexA(h, a) { return h + Math.round(c01(a) * 255).toString(16).padStart(2, '0'); }

/* ---------- scene table ---------- */
const SCENES = [
  { s: 0, e: 4, name: '01 · INTRO', col: GREEN },
  { s: 4, e: 10, name: '02 · PESTO', col: GREEN },
  { s: 10, e: 16, name: '03 · BILINGUAL', col: CYAN },
  { s: 16, e: 23, name: '04 · SPEED', col: GREEN },
  { s: 23, e: 31, name: '05 · PASTA', col: ORANGE },
  { s: 31, e: 37, name: '06 · SAFETY', col: AMBER },
  { s: 37, e: 43, name: '07 · VERIFIED', col: GREEN },
  { s: 43, e: 48, name: '08 · OFFLINE', col: CYAN },
  { s: 48, e: 54, name: '09 · NUMBERS', col: ORANGE },
  { s: 54, e: 60, name: '10 · FINALE', col: GREEN },
];
const sceneAt = t => SCENES.find(s => t >= s.s && t < s.e) || SCENES[SCENES.length - 1];

/* ---------- background ---------- */
const dust = Array.from({ length: 140 }, () => ({ x: R() * W, y: R() * H, z: .3 + R() * .9, p: R() * 6 }));
function bg(t, sc) {
  ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W / 2, H * .45, 80, W / 2, H * .45, 1100);
  g.addColorStop(0, hexA(sc.col, .16 + pulse(t) * .06)); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // perspective grid floor
  ctx.save(); ctx.strokeStyle = hexA(sc.col, .16); ctx.lineWidth = 1.5;
  const hz = 640;
  ctx.beginPath();
  for (let i = -16; i <= 16; i++) { ctx.moveTo(W / 2 + i * 40, hz); ctx.lineTo(W / 2 + i * 340, H); }
  const off = (t * .7) % 1;
  for (let k = 0; k < 14; k++) { const f = (k + off) / 14, y = hz + (H - hz) * f * f; ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke(); ctx.restore();
  // dust
  ctx.save();
  for (const d of dust) {
    const y = ((d.y - t * 24 * d.z) % H + H) % H, x = d.x + Math.sin(t * .6 + d.p) * 18;
    ctx.globalAlpha = .12 + .25 * d.z * (.5 + .5 * Math.sin(t * 2 + d.p));
    ctx.fillStyle = d.z > 1 ? ORANGE : GREEN;
    ctx.fillRect(x, y, 2.5 * d.z, 2.5 * d.z);
  }
  ctx.restore();
}

/* ============================================================
   SCENE 1 — INTRO (particles → logo)
   ============================================================ */
const logoPts = (() => {
  const o = document.createElement('canvas'); o.width = 1920; o.height = 360; const g = o.getContext('2d');
  g.font = `900 210px ${SANS}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#fff';
  g.fillText('PESTO + PASTA', 960, 180);
  const d = g.getImageData(0, 0, 1920, 360).data, pts = [];
  for (let y = 0; y < 360; y += 6) for (let x = 0; x < 1920; x += 6) if (d[(y * 1920 + x) * 4 + 3] > 140) pts.push({ x, y: y + 210, sx: R() * W, sy: R() * H, dl: R() * .9, a: R() * 6.28 });
  return pts;
})();
function sceneIntro(lt) {
  const grad = ctx.createLinearGradient(260, 0, 1660, 0); grad.addColorStop(0, GREEN); grad.addColorStop(1, ORANGE);
  const ex = Math.max(0, lt - 3.45);
  for (const p of logoPts) {
    const q = outExpo(c01((lt - .05 - p.dl) / 1.3));
    let x = lerp(p.sx, p.x, q), y = lerp(p.sy, p.y, q);
    if (q >= 1) { x += Math.sin(lt * 8 + p.a) * 1.2; y += Math.cos(lt * 7 + p.a) * 1.2; }
    if (ex > 0) { x += Math.cos(p.a) * ex * ex * 1700; y += Math.sin(p.a) * ex * ex * 1700; }
    const f = p.x / W;
    ctx.fillStyle = f < .46 ? GREEN : ORANGE;
    ctx.globalAlpha = lt > 2.3 ? 1 - smooth(seg(lt, 2.3, 2.8)) * .75 : .95;
    const s = 4.5 - q * 1.5;
    ctx.fillRect(x, y, s, s);
  }
  ctx.globalAlpha = 1;
  const a = smooth(seg(lt, 2.0, 2.6)) * (1 - seg(lt, 3.5, 3.9));
  if (a > 0) {
    ctx.save(); ctx.globalAlpha = a; ctx.shadowColor = GREEN; ctx.shadowBlur = 20;
    T('PESTO + PASTA', W / 2, 390, { size: 210, color: grad, glitch: Math.max(0, .9 - (lt - 2.0) * 1.2) + (pulse(lt) * .12) });
    ctx.restore();
  }
  const sub = outCubic(seg(lt, 2.4, 3.2)) * (1 - seg(lt, 3.5, 3.9));
  T('VOICE  ·  LOCAL  ·  GREEK + ENGLISH', W / 2, 590, { size: 40, color: '#cfe', font: UI, weight: 700, ls: 14 + (1 - sub) * 40, alpha: sub });
  T('ΦΩΝΗ  ΧΩΡΙΣ  ΣΥΝΔΕΣΗ', W / 2, 660, { size: 30, color: ORANGE, font: UI, weight: 700, ls: 18, alpha: sub * .9 });
  // scanning line
  if (lt < 2.4) { ctx.fillStyle = hexA(GREEN, .55); ctx.fillRect(0, lerp(0, H, lt / 2.4), W, 3); }
}

/* ============================================================
   SCENE 2 — PESTO: hold, speak, release
   ============================================================ */
function waveform(cx, cy, w, amp, t, col, n = 56) {
  const bw = w / n;
  for (let i = 0; i < n; i++) {
    const env = Math.sin(i / n * Math.PI);
    const v = (.35 + .65 * Math.abs(Math.sin(t * 9 + i * .7) * Math.cos(t * 5.3 + i * .31))) * env * amp;
    const hh = 6 + v * 260;
    ctx.fillStyle = col; ctx.globalAlpha = .55 + v * .45;
    rr(cx - w / 2 + i * bw + 3, cy - hh / 2, bw - 6, hh, 6); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function scenePesto(lt) {
  const words = ['HOLD.', 'SPEAK.', 'RELEASE.'], cols = [GREEN, CYAN, ORANGE];
  for (let i = 0; i < 3; i++) {
    const st = i * .55, q = seg(lt, st, st + .35);
    if (q <= 0) continue;
    const sc = lerp(2.6, 1, outBack(q)), x = 400 + i * 560;
    T(words[i], x, 190, { size: 128 * sc, color: cols[i], alpha: q, glitch: 1 - q, shadow: cols[i] });
  }
  const held = lt >= .8 && lt < 2.9;
  const kx = 440, ky = 560;
  const hp = held ? 1 : 0;
  if (held) for (let i = 0; i < 3; i++) {
    const ph = ((lt - .8) * 1.1 + i / 3) % 1;
    ctx.strokeStyle = hexA(GREEN, 1 - ph); ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(kx, ky + 8, 150 + ph * 250, 0, 6.283); ctx.stroke();
  }
  key('R CTRL', kx, ky, 300, 170, held, GREEN);
  T(held ? 'LISTENING…' : lt < .8 ? 'PRESS & HOLD' : '', kx, ky + 150, { size: 30, color: held ? GREEN : '#789', font: UI, ls: 8, weight: 700 });
  // waveform / spinner
  const wx = 1200, wy = 560;
  if (held) {
    waveform(wx, wy, 860, smooth(seg(lt, .8, 1.2)) * (.6 + .4 * Math.sin(lt * 4) ** 2), lt, GREEN);
    T('● REC', 800, 420, { size: 28, color: RED, font: UI, align: 'left', weight: 800, alpha: .5 + .5 * Math.sin(lt * 12) ** 2 });
    T('EL / EN · auto', 1620, 420, { size: 28, color: CYAN, font: MONO, align: 'right', weight: 700 });
  } else if (lt >= 2.9 && lt < 3.4) {
    const a = (lt - 2.9) * 14;
    ctx.strokeStyle = ORANGE; ctx.lineWidth = 14; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(wx, wy, 90, a, a + 4.2); ctx.stroke();
    T('TRANSCRIBING', wx, wy + 160, { size: 28, color: ORANGE, font: UI, ls: 10, weight: 700 });
  }
  // text box
  const bx = 260, by = 790, bw = 1400, bh = 130;
  card(bx, by, bw, bh, { stroke: lt > 3.3 ? GREEN : 'rgba(255,255,255,.18)', glow: lt > 3.3 ? hexA(GREEN, .5) : null, r: 20 });
  T('notes.txt — Notepad', bx + 24, by - 28, { size: 22, color: '#789', font: MONO, align: 'left', weight: 400 });
  const msg = 'Καλημέρα κόσμε — hello world, typed anywhere.';
  const shown = typed(msg, seg(lt, 3.3, 4.2));
  const caret = (Math.floor(lt * 3) % 2 === 0 || lt < 4.4) ? '▌' : ' ';
  T(shown + (lt > 3.2 ? caret : ''), bx + 36, by + bh / 2, { size: 54, color: '#e8fff0', font: UI, align: 'left', weight: 600 });
  if (lt >= 3.4) {
    const q = outBack(seg(lt, 3.4, 3.75));
    withTransform(1500, 735, q, -.05, () => pill('286 ms', 0, 0, GREEN, { size: 40, h: 72, padX: 34 }));
  }
  if (lt > 4.5) T('NO MOUSE. NO WINDOW SWITCH. JUST TEXT.', W / 2, 990, { size: 34, color: '#cfe', font: UI, ls: 10, weight: 700, alpha: seg(lt, 4.5, 4.9) });
}

/* ============================================================
   SCENE 3 — BILINGUAL
   ============================================================ */
const GREEK = ['καλημέρα', 'ευχαριστώ', 'πρωτόκολλο', 'υπολογιστής', 'φωνή', 'γρήγορα', 'ταχύτητα', 'πάστα', 'ανοιχτό', 'σχέδιο', 'αλήθεια', 'ελευθερία'];
const ENG = ['latency', 'dictation', 'offline', 'whisper', 'instant', 'command', 'privacy', 'GPU', 'accuracy', 'pipeline', 'verified', 'local'];
function marquee(words, y, speed, dir, col, size, t) {
  ctx.save(); ctx.font = `800 ${size}px ${SANS}`;
  const gap = 90, widths = words.map(w => ctx.measureText(w).width + gap), total = widths.reduce((a, b) => a + b, 0);
  ctx.restore();
  let x = ((t * speed * dir) % total + total) % total - total;
  for (let rep = 0; rep < 3; rep++) {
    let xx = x + rep * total;
    for (let i = 0; i < words.length; i++) {
      if (xx > -500 && xx < W + 100) T(words[i], xx, y, { size, color: i % 3 === 0 ? col : hexA(col, .28), align: 'left', ls: 2 });
      xx += widths[i];
    }
  }
}
function sceneBilingual(lt) {
  const t = lt + 10;
  marquee(GREEK, 150, 340, -1, ORANGE, 120, t);
  marquee(ENG, 950, 420, 1, CYAN, 120, t);
  const items = [
    { x: 520, v: 12.28, label: 'GREEK WER', sub: 'Σ  final sigma · accents', col: ORANGE, st: .5 },
    { x: 1400, v: 5.52, label: 'ENGLISH WER', sub: 'FLEURS · 200 + 200 utterances', col: CYAN, st: .9 },
  ];
  for (const it of items) {
    const q = outBack(seg(lt, it.st, it.st + .5));
    if (q <= 0) continue;
    withTransform(it.x, 540, q, 0, () => {
      card(-340, -230, 680, 460, { glow: hexA(it.col, .45), stroke: it.col });
      const n = it.v * outCubic(seg(lt, it.st + .1, it.st + 1.6));
      T(n.toFixed(2) + '%', 0, -60, { size: 150, color: '#fff', shadow: it.col });
      T(it.label, 0, 60, { size: 46, color: it.col, font: UI, ls: 10, weight: 800 });
      T(it.sub, 0, 130, { size: 26, color: '#9ab', font: UI, weight: 500 });
    });
  }
  if (lt > 2.2) {
    const q = outBack(seg(lt, 2.2, 2.7));
    withTransform(W / 2, 540, q, 0, () => {
      ctx.beginPath(); ctx.arc(0, 0, 70, 0, 6.283); ctx.fillStyle = '#0c1115'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = GREEN; ctx.stroke();
      T('⇄', 0, -4, { size: 70, color: GREEN, font: UI });
    });
  }
  if (lt > 3.2) {
    const a = seg(lt, 3.2, 3.7);
    pill('WHISPER LARGE-V3-TURBO', W / 2, 800, GREEN, { size: 30 });
    ctx.globalAlpha = a;
    T('ONE MODEL · TWO LANGUAGES · ZERO SWITCHING', W / 2, 870, { size: 32, color: '#cfe', font: UI, ls: 8, weight: 700, alpha: a });
    ctx.globalAlpha = 1;
  }
  if (lt > 4.3) {
    const sw = (Math.floor((lt - 4.3) / .45) % 3);
    ['AUTO', 'ΕΛΛΗΝΙΚΑ', 'ENGLISH'].forEach((n, i) => pill(n, 700 + i * 260, 262, i === sw ? GREEN : '#567', { size: 26, h: 50 }));
  }
}

/* ============================================================
   SCENE 4 — SPEED
   ============================================================ */
function sceneSpeed(lt) {
  T('FASTER THAN YOU CAN FINISH THE SENTENCE', W / 2, 150, { size: 50, color: '#fff', font: UI, ls: 6, weight: 800, alpha: outCubic(seg(lt, 0, .5)) });
  const rows = [
    { label: 'PESTO v2 baseline', ms: 804, col: RED },
    { label: 'PESTO v3 · Whisper', ms: 450, col: GREEN },
    { label: 'Parakeet TDT · EN', ms: 124, col: CYAN },
  ];
  const clock = outCubic(seg(lt, .4, 2.8)) * 850, x0 = 470, k = 1.2;
  rows.forEach((r, i) => {
    const y = 300 + i * 125, fill = Math.min(r.ms, clock), done = clock >= r.ms;
    T(r.label, x0 - 30, y, { size: 36, color: '#cfe', font: UI, align: 'right', weight: 700 });
    rr(x0, y - 34, 1000 * 1.2 + 0, 68, 14); ctx.fillStyle = 'rgba(255,255,255,.05)'; ctx.fill();
    ctx.save(); ctx.shadowColor = r.col; ctx.shadowBlur = done ? 40 : 18;
    rr(x0, y - 34, Math.max(2, fill * k), 68, 14); ctx.fillStyle = r.col; ctx.fill(); ctx.restore();
    T(Math.round(fill) + ' ms', x0 + fill * k + 22, y, { size: 52, color: '#fff', font: MONO, align: 'left', weight: 800 });
  });
  if (lt > 3) {
    const q = outBack(seg(lt, 3, 3.4));
    withTransform(W / 2, 700, q, -.02, () => {
      T('−351 ms', -210, 0, { size: 150, color: GREEN, shadow: GREEN, glitch: Math.max(0, 1 - (lt - 3) * 3) });
      T('MEDIAN LATENCY CUT', 260, -22, { size: 36, color: '#fff', font: UI, ls: 6, align: 'left', weight: 800 });
      T('3 s utterance · ABBA paired test', 260, 26, { size: 26, color: '#9ab', font: UI, align: 'left', weight: 500 });
    });
  }
  const cards = [
    { x: 400, big: '8.1 s → 4.4 s', sub: 'cold start to first text', col: ORANGE },
    { x: 960, big: '~4 ms', sub: 'Silero VAD speech gate', col: CYAN },
    { x: 1520, big: 'p < 10⁻¹⁵', sub: 'Wilcoxon · 100 paired clips', col: GREEN },
  ];
  cards.forEach((c, i) => {
    const q = outBack(seg(lt, 4.1 + i * .3, 4.6 + i * .3)); if (q <= 0) return;
    withTransform(c.x, 880, q, 0, () => {
      card(-250, -100, 500, 200, { stroke: c.col, glow: hexA(c.col, .35), r: 24 });
      T(c.big, 0, -22, { size: 62, color: '#fff', shadow: c.col });
      T(c.sub, 0, 52, { size: 26, color: c.col, font: UI, weight: 700 });
    });
  });
}

/* ============================================================
   SCENE 5 — PASTA pipeline
   ============================================================ */
const NODES = [
  { ic: '🎙', n: 'ROUTER', s: 'wake word' },
  { ic: '⚡', n: 'GRAMMAR', s: '< 0.1 ms' },
  { ic: '🧭', n: 'PLANNER', s: 'live desktop' },
  { ic: '🛡', n: 'SAFETY', s: 'auto' },
  { ic: '⚙', n: 'EXECUTOR', s: 'UI Automation' },
  { ic: '✔', n: 'VERIFY', s: 'observed' },
];
function scenePasta(lt) {

  const ok = tt => tt >= offset - .001;
  const env = (g, t, dur, peak) => { g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + .004); g.gain.exponentialRampToValueAtTime(.0008, t + dur); };
  const kick = (tt, v = 1) => { if (!ok(tt)) return; const t = at(tt), o = a.createOscillator(), g = a.createGain(); o.frequency.setValueAtTime(170, t); o.frequency.exponentialRampToValueAtTime(42, t + .14); env(g, t, .34, .95 * v); o.connect(g).connect(master); o.start(t); o.stop(t + .4); };
  const noise = (tt, dur, type, f, peak, q = 1) => { if (!ok(tt)) return; const t = at(tt), s = a.createBufferSource(), fl = a.createBiquadFilter(), g = a.createGain(); s.buffer = nb; fl.type = type; fl.frequency.value = f; fl.Q.value = q; env(g, t, dur, peak); s.connect(fl).connect(g).connect(master); s.start(t, Math.random()); s.stop(t + dur + .05); };
  const tone = (tt, dur, midi, type, peak, cut) => { if (!ok(tt)) return; const t = at(tt), o = a.createOscillator(), fl = a.createBiquadFilter(), g = a.createGain(); o.type = type; o.frequency.value = mtof(midi); fl.type = 'lowpass'; fl.frequency.setValueAtTime(cut, t); fl.frequency.exponentialRampToValueAtTime(Math.max(120, cut * .25), t + dur); env(g, t, dur, peak); o.connect(fl).connect(g).connect(master); o.start(t); o.stop(t + dur + .05); };
  const riser = (from, to) => { if (!ok(from)) return; const t = at(from), d = to - from, s = a.createBufferSource(), fl = a.createBiquadFilter(), g = a.createGain(); s.buffer = nb; s.loop = true; fl.type = 'bandpass'; fl.Q.value = 3; fl.frequency.setValueAtTime(250, t); fl.frequency.exponentialRampToValueAtTime(9000, t + d); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.38, t + d); g.gain.linearRampToValueAtTime(0, t + d + .04); s.connect(fl).connect(g).connect(master); s.start(t); s.stop(t + d + .1); };
  const impact = tt => { kick(tt, 1.2); noise(tt, .7, 'lowpass', 2500, .5); tone(tt, 1.1, 33, 'sine', .7, 400); };
  master.gain.cancelScheduledValues(a.currentTime); master.gain.setValueAtTime(muted ? 0 : .8, a.currentTime);
  const fadeAt = at(DUR - 1.2); if (fadeAt > a.currentTime) { master.gain.setValueAtTime(muted ? 0 : .8, fadeAt); master.gain.linearRampToValueAtTime(0, at(DUR)); }

  const bass = [33, 33, 29, 31];     // A1 A1 F1 G1 per bar
  const arpN = [[57, 60, 64, 69], [57, 60, 64, 69], [53, 57, 60, 65], [55, 59, 62, 67]];
  for (let n = 0; n * BEAT < DUR; n++) {
    const tt = n * BEAT, bar = Math.floor(n / 4) % 4, step = n % 4;
    // intro heartbeat
    if (tt < 4) { if (step === 0 || step === 2) kick(tt, .45); continue; }
    if (tt >= 54) {                        // finale: soft pulse + pad
      if (tt < 58.5) kick(tt, .5);
      continue;
    }
    kick(tt, 1);
    noise(tt + BEAT / 2, .06, 'highpass', 8000, .16);
    if (tt >= 10 && (step === 1 || step === 3)) { noise(tt, .18, 'bandpass', 1600, .45, .7); }
    if (tt >= 10) tone(tt + BEAT / 2, BEAT * .45, bass[bar] + 12 * (step === 3 ? 1 : 0), 'sawtooth', .22, 900);
    for (let k = 0; k < 4 && tt >= 16; k++) tone(tt + k * BEAT / 4, BEAT / 4 * .9, arpN[bar][(k + step) % 4] + (tt >= 48 ? 12 : 0), 'square', .06, 3200);
    if (tt >= 48) { noise(tt + BEAT / 4, .04, 'highpass', 9000, .12); noise(tt + BEAT * .75, .04, 'highpass', 9000, .12); }
  }
  // stems
  [[4, 'imp'], [10, 'imp'], [16, 'imp'], [23, 'imp'], [31, 'imp'], [37, 'imp'], [43, 'imp'], [48, 'imp'], [54, 'big']].forEach(([b, k]) => { impact(b); if (k === 'big') { noise(b, 2.2, 'lowpass', 5000, .5); } });
  riser(1.2, 4); [8, 14, 21, 29, 35, 41, 46, 52].forEach(b => riser(b - 1.6, b));
  // finale pad Am chord
  [57, 60, 64, 69].forEach(m => { tone(54.05, 5.5, m, 'sawtooth', .09, 2400); tone(54.05, 5.5, m - 12, 'sine', .08, 1200); });
  // stat blips (scene 9)
  for (let i = 0; i < 6; i++) { tone(48 + i * BEAT * 2, .3, 81 + i, 'square', .1, 5000); }
  // UI blips
  tone(7.0, .25, 93, 'sine', .15, 6000); tone(11.0, .2, 88, 'sine', .12, 6000); tone(25.0, .3, 88, 'sine', .12, 6000);
  [25.6, 26.4, 27.2, 28.1, 28.9, 29.7].forEach((tt, i) => tone(tt, .22, 76 + i * 2, 'triangle', .22, 6000));
  tone(30.4, .6, 84, 'sine', .25, 8000); tone(30.4, .6, 91, 'sine', .15, 8000);
}

/* ============================================================
   PLAYBACK ENGINE
   ============================================================ */
const gate = document.getElementById('gate'), hint = document.getElementById('hint');
let tNow = 0, playing = false, lastTs = null, recorder = null;
function ensureAudio() {
  if (!AC) {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.connect(AC.destination);
    recDest = AC.createMediaStreamDestination(); master.connect(recDest);
  }
  return AC.resume();
}
function startAudioAt(off) { if (AC) { AC.close(); AC = null; } ensureAudio().then(() => { buildAudio(off); }); }
function play(from = 0) { tNow = from; playing = true; lastTs = null; if (!window.__noaudio) startAudioAt(from); }
function togglePause() { playing = !playing; lastTs = null; if (AC) playing ? AC.resume() : AC.suspend(); }
function seek(dt) { tNow = Math.max(0, Math.min(DUR - .01, tNow + dt)); if (!window.__noaudio && playing) startAudioAt(tNow); }
function frame(ts) {
  if (playing) {
    if (lastTs !== null) tNow += (ts - lastTs) / 1000;
    lastTs = ts;
    if (tNow >= DUR) { tNow = DUR - .001; playing = false; if (recorder) stopRec(); }
  }
  render(tNow);
  requestAnimationFrame(frame);
}
function begin() { gate.classList.add('off'); hint.classList.add('on'); setTimeout(() => hint.classList.remove('on'), 6000); play(0); }
gate.addEventListener('click', begin);
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); if (!gate.classList.contains('off')) begin(); else togglePause(); }
  else if (e.code === 'ArrowRight') seek(2); else if (e.code === 'ArrowLeft') seek(-2);
  else if (e.key === 'r' || e.key === 'R') play(0);
  else if (e.key === 'm' || e.key === 'M') { muted = !muted; if (master) master.gain.value = muted ? 0 : .8; }
  else if (e.key === 'f' || e.key === 'F') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
  else if (e.key === 'e' || e.key === 'E') startRec();
});
/* export: records canvas + synthesized audio to WebM in real time */
function startRec() {
  gate.classList.add('off'); playing = false; window.__noaudio = false;
  if (AC) { AC.close(); AC = null; }
  ensureAudio().then(() => {
    const vs = cv.captureStream(60), as = recDest.stream;
    recorder = new MediaRecorder(new MediaStream([...vs.getVideoTracks(), ...as.getAudioTracks()]), { mimeType: 'video/webm;codecs=vp9,opus', videoBitsPerSecond: 16e6 });
    const chunks = []; recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
    recorder.onstop = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' })); a.download = 'PESTO_PASTA_showcase.webm'; a.click(); recorder = null; };
    recorder.start(); buildAudio(0); tNow = 0; playing = true; lastTs = null;
  });
}
function stopRec() { try { recorder.stop(); } catch (e) { } }

/* test hooks: ?t=12.5 paused frame, ?silent autoplay with no sound */
const qs = new URLSearchParams(location.search);
window.seekTo = s => { tNow = s; };
if (qs.has('t')) { gate.classList.add('off'); window.__noaudio = true; tNow = parseFloat(qs.get('t')); playing = false; }
else if (qs.has('silent')) { gate.classList.add('off'); window.__noaudio = true; playing = true; }
requestAnimationFrame(frame);
</script>
