[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pesto-pasta"
version = "3.0.0.dev0"
description = "PESTO: local Greek/English push-to-talk speech input for Windows. PASTA: voice commands on top of it."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "sounddevice>=0.4.6",
    "faster-whisper>=1.2.0",
    "ctranslate2>=4.5",
    "onnx-asr[hub]>=0.10",
    "onnxruntime-gpu>=1.20; platform_system == 'Windows'",
    "huggingface_hub>=0.25",
    "PySide6-Essentials>=6.8",
]

[project.optional-dependencies]
pasta = ["comtypes>=1.2", "uiautomation>=2.0.18"]
research = ["scipy>=1.11", "matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
pesto = "pesto.cli:main"
pasta = "pasta.cli:main"

[tool.setuptools.packages.find]
include = ["pesto*", "pasta*", "research*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
